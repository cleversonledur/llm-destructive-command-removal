[project]
name = "destructive-ablation"
version = "0.1.0"
description = "Find and remove the direction that drives destructive tool calls in a small language model."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "transformers>=4.56",
    "accelerate>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ablation = "ablation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ablation"]
